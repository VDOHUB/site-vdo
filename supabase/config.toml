# Configuracao minima do Supabase local (CLI). Valores omitidos usam os padroes da CLI.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "site-viver-de-obra"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# Sem auto-cadastro: o primeiro admin e criado manualmente (ver DEPLOY.md).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enabled = true
enable_confirmations = false
